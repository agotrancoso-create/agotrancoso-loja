name: Deploy prebuilt production

on:
  workflow_dispatch:
  push:
    branches:
      - force-production-20261002

permissions:
  contents: read

concurrency:
  group: ago-prebuilt-production
  cancel-in-progress: false

# Manual fallback only. Normal production deploys are handled by the
# Vercel Git integration on pushes to main and verified by indexnow.yml.
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_JMr3tbyWPEuHBxBpCQlKxy38
      VERCEL_PROJECT_ID: prj_LBBeHK0hMgy7hxmxMI2GJKCunlhV
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check Vercel credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not configured in this repository."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Pull production environment
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production outside Vercel build queue
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        id: deploy
        shell: bash
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url"

      - name: Verify deployed URL
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          expected="${GITHUB_SHA:0:12}"
          for attempt in {1..30}; do
            body=$(curl --fail --silent --show-error "$DEPLOY_URL/api/health" || true)
            version=$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).version||'')}catch{}})")
            if [ "$version" = "$expected" ]; then
              echo "Deployment URL is serving $version"
              exit 0
            fi
            sleep 2
          done
          echo "Deployment URL did not expose expected build version $expected"
          exit 1

      - name: Verify public domains
        shell: bash
        run: |
          expected="${GITHUB_SHA:0:12}"
          www=$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "https://www.agotrancoso.com.br/api/health?build=${GITHUB_RUN_ID}" || true)
          www_version=$(printf '%s' "$www" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).version||'')}catch{}})")
          test "$www_version" = "$expected"

          apex_final=$(curl --fail --silent --show-error -L -o /tmp/ago-apex-health.json -w '%{url_effective}' "https://agotrancoso.com.br/api/health?build=${GITHUB_RUN_ID}")
          apex_version=$(node -e "const fs=require('fs');try{process.stdout.write(JSON.parse(fs.readFileSync('/tmp/ago-apex-health.json','utf8')).version||'')}catch{}")
          test "$apex_version" = "$expected"
          case "$apex_final" in
            https://www.agotrancoso.com.br/*) ;;
            *) echo "Apex did not canonicalize to www: $apex_final"; exit 1;;
          esac
          echo "Both public domains serve $expected; apex canonicalizes to www."
