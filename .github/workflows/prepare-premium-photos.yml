name: Prepare premium product photos

on:
  push:
    branches:
      - feat/fotos-premium-recuperacao-20261010
    paths:
      - scripts/prepare-premium-photos.py
      - .github/workflows/prepare-premium-photos.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-lossless-photos:
    if: github.ref == 'refs/heads/feat/fotos-premium-recuperacao-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install photo-processing dependencies
        run: |
          python -m pip install 'rembg[cpu]==2.0.85' 'pillow==12.3.0' 'opencv-python-headless==5.0.0.93' 'numpy==2.5.3'
      - name: Generate all 38 catalog photographs
        run: |
          python scripts/prepare-premium-photos.py
      - name: Assert all outputs are present
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          mapping = json.loads(Path('data/premium-photo-map.json').read_text())
          assert len(mapping) == 38, f'Expected 38 photos, got {len(mapping)}'
          assert all((Path('public') / src.lstrip('/')).exists() for src in mapping.values())
          report = json.loads(Path('data/premium-photo-report.json').read_text())
          assert len(report) == 38
          assert all(row['verified_lossless'] for row in report)
          print('PASS: 38 preserved lossless premium outputs.')
          print('Manual visual review requested:', sum(row['manual_visual_review'] for row in report))
          PY
      - name: Save to working branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/produtos/premium data/premium-photo-map.json data/premium-photo-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Prepare 38 lossless premium catalog photos for visual review"
            git push origin HEAD:feat/fotos-premium-recuperacao-20261010
          fi
