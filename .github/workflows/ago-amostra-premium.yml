name: Amostra TikTok Premium Agô
on:
  push:
    branches: [main]
    paths:
      - scripts/ago_amostra_premium.py
      - .github/workflows/ago-amostra-premium.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ago-amostra-premium
  cancel-in-progress: false
jobs:
  criar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar edição de vídeo
        run: python -m pip install --disable-pip-version-check pillow numpy imageio-ffmpeg
      - name: Gerar amostra sem IA generativa
        run: python scripts/ago_amostra_premium.py
      - name: Verificar MP4
        run: |
          test -s public/videos/tiktok/amostra-rabo-de-baleia-natural.mp4
          test -s public/videos/tiktok/amostra-rabo-de-baleia-capa.jpg
      - name: Disponibilizar vídeo para avaliação da Agô
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/tiktok/amostra-rabo-de-baleia-natural.mp4 public/videos/tiktok/amostra-rabo-de-baleia-capa.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Salvar amostra de TikTok para revisão da Agô"
            git push
          fi
