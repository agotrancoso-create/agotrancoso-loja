name: TikTok Serie 2 - retencao e musica original
on:
  push:
    branches: [main]
    paths:
      - scripts/ago_tiktok_retencao.py
      - .github/workflows/ago-tiktok-retencao.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ago-tiktok-retencao
  cancel-in-progress: false

jobs:
  criar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar edicao de video
        run: python -m pip install --disable-pip-version-check pillow numpy imageio-ffmpeg
      - name: Gerar videos reais com trilha original
        run: python scripts/ago_tiktok_retencao.py
      - name: Verificar oito videos
        run: |
          count=$(find public/videos/tiktok/serie2 -name '*.mp4' | wc -l)
          echo "Arquivos gerados: $count"
          test "$count" -eq 8
      - name: Publicar arquivos na pasta de midia do projeto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/tiktok/serie2/
          if ! git diff --cached --quiet; then
            git commit -m "Adicionar 8 TikToks com trilhas originais e fotos reais"
            git push
          fi
