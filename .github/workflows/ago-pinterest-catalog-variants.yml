name: Fotos de variantes para catalogo Pinterest
on:
  push:
    branches: [main]
    paths:
      - scripts/ago_pinterest_catalog_images.py
      - .github/workflows/ago-pinterest-catalog-variants.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ago-pinterest-variants
  cancel-in-progress: false
jobs:
  fotos:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Criar retratos reais das variantes
        run: |
          python scripts/ago_pinterest_catalog_images.py
          test "$(find public/pinterest/catalog-variants -maxdepth 1 -name '*.jpg' | wc -l)" -eq 5
      - name: Salvar fotos no repositorio da loja
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pinterest/catalog-variants/
          if ! git diff --cached --quiet; then
            git commit -m "Adicionar cinco fotos verticais para catalogo Pinterest"
            git push
          fi
