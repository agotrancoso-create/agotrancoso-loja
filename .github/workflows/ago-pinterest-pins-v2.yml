name: Pinterest Agô — pins visuais v2
on:
  push:
    branches: [main]
    paths:
      - scripts/ago_pinterest_pins_v2.py
      - .github/workflows/ago-pinterest-pins-v2.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ago-pinterest-v2
  cancel-in-progress: false
jobs:
  pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Preparar recortes reais e conferir Pins
        run: |
          python scripts/ago_pinterest_pins_v2.py
          count=$(find public/pinterest/pins-v2 -maxdepth 1 -name '[0-9][0-9]-*.jpg' | wc -l)
          test "$count" -eq 22
      - name: Salvar coleção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pinterest/pins-v2/
          if ! git diff --cached --quiet; then
            git commit -m "Publicar pins v2 com fotos reais e melhor enquadramento"
            git push
          fi
