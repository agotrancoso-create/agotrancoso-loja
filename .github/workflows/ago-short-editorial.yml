name: Agô Short editorial + vistoria
on:
  push:
    branches: [main]
    paths:
      - scripts/ago_short_editorial.py
      - .github/workflows/ago-short-editorial.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ago-shorts-editorial
  cancel-in-progress: false
jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install processing deps
        run: python -m pip install --disable-pip-version-check pillow numpy imageio-ffmpeg
      - name: Render editorial MP4 and QA preview
        run: |
          python scripts/ago_short_editorial.py
          test -s public/videos/shorts/igreja-quadrado-p-editorial.mp4
          test -s public/videos/shorts/qa-igreja-short-celular.jpg
      - name: Save reviewed assets for scheduling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/shorts/igreja-quadrado-p-editorial.mp4 public/videos/shorts/qa-igreja-short-celular.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Salvar Short editorial e sua previa de vistoria"
            git push
          fi
