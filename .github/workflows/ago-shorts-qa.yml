name: QA real Short Agô antes de publicar
on:
  push:
    branches: [main]
    paths:
      - scripts/ago_shorts_qa.py
      - .github/workflows/ago-shorts-qa.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preparar o ambiente da inspeção
        run: python -m pip install --disable-pip-version-check pillow imageio-ffmpeg
      - name: Inspecionar quadros reais do MP4
        run: python scripts/ago_shorts_qa.py
      - name: Publicar prévia somente para revisão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/tiktok/celular/qa-short-igreja-youtube.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Salvar preview do Short em áreas seguras do YouTube"
            git push
          fi
