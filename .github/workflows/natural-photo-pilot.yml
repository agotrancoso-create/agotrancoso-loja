name: Natural light and shadow photo proof (preview only)

on:
  push:
    branches:
      - feat/photography-natural-light-shadow-pilot-20261010
    paths:
      - scripts/pilot-natural-light-photos.py
      - .github/workflows/natural-photo-pilot.yml
      - scripts/create-natural-catalog.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-safe-samples:
    if: github.ref == 'refs/heads/feat/photography-natural-light-shadow-pilot-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image libraries
        run: python -m pip install 'pillow==12.3.0' 'numpy==2.5.3'
      - name: Produce natural light and shadow proof
        run: |
          python scripts/pilot-natural-light-photos.py
          python scripts/create-natural-catalog.py
      - name: Verify originals and proof output
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          report=json.loads(Path('data/natural-photo-pilot.json').read_text())
          assert len(report)==4
          for r in report:
              assert r['lossless_pixel_verified']
              assert r['preservation_percent']>=78
              img=Path('public')/r['pilot'].lstrip('/')
              assert img.is_file()
              with Image.open(img) as im:
                  assert im.width==im.height
                  assert im.width>=960
              assert (Path('public')/r['original'].lstrip('/')).is_file()
          mapping=json.loads(Path('data/natural-photo-map.json').read_text())
          summaries=json.loads(Path('data/natural-photo-report.json').read_text())
          assert len(mapping)==38 and len(summaries)==38
          assert all(r['lossless'] and r['unaltered_percent']>=78 for r in summaries)
          assert all((Path('public')/dest.lstrip('/')).is_file() for dest in mapping.values())
          print('PASS: 38 natural full-catalog photos and 4 review comparisons, preserving original lighting and pixels.')
          PY
      - name: Save preview images, never publish to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/produtos/piloto-natural public/produtos/natural data/natural-photo-pilot.json data/natural-photo-map.json data/natural-photo-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add four verified natural-light image previews (originals untouched)'
            git push origin HEAD:feat/photography-natural-light-shadow-pilot-20261010
          fi
