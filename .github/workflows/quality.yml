name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Normalize all active product photography
        run: node scripts/normalize-product-images.mjs

      - name: Catalog and photography contract
        run: npm run audit:catalog

      - name: Commerce contract
        run: npm run qa:commerce

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "Production build attempt $attempt/2"
            if npm run build; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "Build failed once; clearing .next and retrying to tolerate transient next/font network failures."
              rm -rf .next
              sleep 2
            fi
          done
          exit 1

      - name: Crawlable catalog and social metadata
        run: node scripts/qa-seo.cjs

      - name: Install browser QA runtime
        run: |
          npm install --no-save --no-audit --no-fund playwright axe-core
          npx playwright install --with-deps chromium
          mkdir -p /tmp/ago-qa

      - name: Mobile and desktop interaction QA
        env:
          QA_WIDTHS: 320,390,820,1440,1920
          QA_ARTIFACTS: /tmp/ago-qa
        run: npm run qa:ui

      - name: Exact Miniatura R$ 480 shipping UI contract
        run: node scripts/qa-shipping-480.cjs

      - name: GA4 ecommerce and CRO analytics contract
        env:
          QA_ARTIFACTS: /tmp/ago-qa
        run: npm run qa:analytics

      - name: WCAG automated audit
        env:
          AXE_PATH: node_modules/axe-core/axe.min.js
          QA_ARTIFACTS: /tmp/ago-qa
        run: node scripts/qa-accessibility.cjs

      - name: Smoke test critical routes and Merchant feed
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > /tmp/ago-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/ago-health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/ago-next.log
            exit 1
          fi

          for path in / /trancoso /artesanato-em-trancoso /lembrancas-de-trancoso /igrejinha-de-trancoso /produtos /produtos/igreja-quadrado-p /produtos/miniatura-quadrado-trancoso /checkout /contato /nossa-essencia /google-merchant.xml /robots.txt /sitemap.xml /image-sitemap.xml /manifest.webmanifest; do
            echo "Checking $path"
            curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:3000$path"
          done

          merchant_xml=$(curl --fail --silent --show-error http://127.0.0.1:3000/google-merchant.xml)
          item_count=$(printf '%s' "$merchant_xml" | grep -o '<item>' | wc -l | tr -d ' ')
          test "$item_count" = "19"
          grep -q '<g:id>miniatura-quadrado-trancoso</g:id>' <<< "$merchant_xml"
          grep -q 'para Pendurar' <<< "$merchant_xml"
          grep -q '<g:brand>Agô Trancoso</g:brand>' <<< "$merchant_xml"
          grep -q '<g:condition>new</g:condition>' <<< "$merchant_xml"
          grep -q '<g:identifier_exists>no</g:identifier_exists>' <<< "$merchant_xml"
          grep -q '<g:google_product_category>' <<< "$merchant_xml"
          grep -q '<g:shipping>' <<< "$merchant_xml"

          if grep -q 'miniatura-quadrado-trancoso.jpg' <<< "$merchant_xml"; then
            echo 'Retired Miniatura base cover is still present in Merchant feed'
            exit 1
          fi
          if grep -q 'miniatura-quadrado-trancoso-3.jpg' <<< "$merchant_xml"; then
            echo 'Retired Miniatura photo 03 is still present in Merchant feed'
            exit 1
          fi
          if grep -R --line-number --exclude-dir=.next --exclude-dir=node_modules 'miniatura-quadrado-trancoso-3.jpg' app data lib components; then
            echo 'Retired Miniatura photo 03 is still referenced by application code'
            exit 1
          fi

          python3 - <<'PY'
          import re, subprocess, sys
          from urllib.parse import urlparse
          from urllib.request import urlopen

          xml = urlopen('http://127.0.0.1:3000/google-merchant.xml', timeout=10).read().decode('utf-8')
          urls = set(re.findall(r'<g:(?:image_link|additional_image_link)>(.*?)</g:', xml))
          failures = []
          for url in urls:
              path = urlparse(url).path
              local = 'http://127.0.0.1:3000' + path
              result = subprocess.run(['curl','--fail','--silent','--show-error','--output','/dev/null',local])
              if result.returncode:
                  failures.append(path)
          if failures:
              print('Broken Merchant image URLs:', failures)
              sys.exit(1)
          print(f'Merchant images OK: {len(urls)} URLs')
          PY

          cat /tmp/ago-health.json

      - name: Upload visual, analytics and accessibility QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ago-quality-evidence
          path: /tmp/ago-qa
          if-no-files-found: ignore
          retention-days: 14
