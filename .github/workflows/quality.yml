name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Catalog audit
        run: npm run audit:catalog

      - name: Commerce contract
        run: node scripts/qa-commerce.cjs

      - name: Payment return contract
        run: node scripts/qa-payment-return.cjs

      - name: Production build
        run: npm run build

      - name: Smoke test critical routes
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > /tmp/ago-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/ago-health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/ago-next.log
            exit 1
          fi

          for path in / /produtos /produtos/igreja-quadrado-p /produtos/miniatura-quadrado-trancoso /checkout /contato /nossa-essencia /google-merchant.xml /robots.txt /sitemap.xml /manifest.webmanifest; do
            echo "Checking $path"
            curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:3000$path"
          done

          merchant_xml=$(curl --fail --silent --show-error http://127.0.0.1:3000/google-merchant.xml)
          echo "$merchant_xml" | grep -q '<g:id>miniatura-quadrado-trancoso</g:id>'
          echo "$merchant_xml" | grep -q 'para Pendurar'
          if echo "$merchant_xml" | grep -q 'miniatura-quadrado-trancoso.jpg'; then
            echo 'Retired Miniatura base cover is still present in Merchant feed'
            exit 1
          fi
          if echo "$merchant_xml" | grep -q 'miniatura-quadrado-trancoso-3.jpg'; then
            echo 'Retired Miniatura photo 03 is still present in Merchant feed'
            exit 1
          fi
          if grep -R --line-number --exclude-dir=.next --exclude-dir=node_modules 'miniatura-quadrado-trancoso-3.jpg' app data lib components; then
            echo 'Retired Miniatura photo 03 is still referenced by application code'
            exit 1
          fi

          cat /tmp/ago-health.json
