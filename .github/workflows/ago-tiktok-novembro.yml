name: TikTok Agô - novos vídeos de novembro
on:
  push:
    branches: [main]
    paths:
      - scripts/ago_tiktok_novembro_24.py
      - .github/workflows/ago-tiktok-novembro.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ago-tiktok-novembro
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ferramentas de vídeo
        run: python -m pip install --disable-pip-version-check pillow numpy imageio-ffmpeg
      - name: Gerar novos vídeos de produtos reais
        run: python scripts/ago_tiktok_novembro_24.py
      - name: Conferir arquivos
        run: |
          count=$(find public/videos/tiktok/novos-novembro -name '*.mp4' | wc -l)
          echo "Novos videos: $count"
          test "$count" -eq 7
      - name: Salvar produções da Agô
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/tiktok/novos-novembro/
          if ! git diff --cached --quiet; then
            git commit -m "Salvar sete vídeos novos para TikTok Agô"
            git push
          fi
