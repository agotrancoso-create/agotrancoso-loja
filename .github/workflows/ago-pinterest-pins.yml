name: Preparar 22 Pins da Ago para Pinterest
on:
  push:
    branches: [main]
    paths:
      - scripts/ago_pinterest_pins.py
      - .github/workflows/ago-pinterest-pins.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ago-pinterest-pins
  cancel-in-progress: false

jobs:
  pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Criar imagens e metadados dos Pins
        run: python scripts/ago_pinterest_pins.py
      - name: Conferir imagens e arquivo
        run: |
          count=$(find public/pinterest/colecao-2026 -maxdepth 1 -name '[0-9][0-9]-*.jpg' | wc -l)
          echo "Total de Pins: $count"
          test "$count" -eq 22
          test -s public/pinterest/colecao-2026/PINS_AGO_TRANCOSO_22.zip
      - name: Guardar arquivos para acesso e agendamento
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pinterest/colecao-2026/
          if ! git diff --cached --quiet; then
            git commit -m "Publicar kit de 22 Pins originais e calendario de divulgacao"
            git push
          fi
